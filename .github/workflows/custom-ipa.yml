name: Build customized DolphiniOS
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - 'Source/iOS/App/DolphiniOS/UI/Emulation/**'
      - 'Source/iOS/App/DolphiniOS.xcodeproj/**'
      - 'Tests/ControllerEditor/**'
      - '.github/workflows/custom-ipa.yml'
  push:
    branches: [master]
    paths:
      - 'Source/iOS/App/DolphiniOS/UI/Emulation/TouchController/**'
      - 'Source/iOS/App/DolphiniOS/UI/Emulation/EmulationiOSViewController.mm'
      - '.github/workflows/custom-ipa.yml'
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test controller preset and gesture core
        run: |
          CORE=Source/iOS/App/DolphiniOS/UI/Emulation/TouchController/Editor
          swiftc "$CORE/TCPreset.swift" "$CORE/TCPresetStore.swift" "$CORE/TCGestureEngine.swift" Tests/ControllerEditor/main.swift -o "$RUNNER_TEMP/controller-tests"
          "$RUNNER_TEMP/controller-tests"
      - name: Install build utilities
        run: |
          brew install cmake ninja bartycrouch
          python3 -m pip install --break-system-packages polib || true
      - name: Build unsigned app
        run: |
          xcodebuild archive \
            -project Source/iOS/App/DolphiniOS.xcodeproj \
            -scheme 'DiOS (NJB)' \
            -configuration 'Release (Non-Jailbroken)' \
            -archivePath "$RUNNER_TEMP/DolphiniOS.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            DOL_PBID_ORGANIZATION_IDENTIFIER='io.github.jptaylor00.customdolphin' \
            DOL_BUILD_SOURCE='development' \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIconBeta \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA without signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          app = Path(os.environ['RUNNER_TEMP']) / "DolphiniOS.xcarchive/Products/Applications/DolphiniOS.app"
          assert app.is_dir(), f"Built application missing: {app}"
          output = Path("products/Custom-DolphiniOS-Unsigned.ipa")
          output.parent.mkdir(exist_ok=True)
          with ZipFile(output, "w", ZIP_DEFLATED, compresslevel=4) as ipa:
              for file in app.rglob("*"):
                  if file.is_file():
                      ipa.write(file, Path("Payload") / app.name / file.relative_to(app))
          print(f"Created {output}: {output.stat().st_size} bytes")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Custom-DolphiniOS-Unsigned
          path: products/Custom-DolphiniOS-Unsigned.ipa
